name: Create and publish a Docker image
on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      build_amd64:
        description: 'Build amd64 image'
        required: false
        default: true
        type: boolean

      build_arm:
        description: 'Build arm64 image (native ARM runner)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_DESCRIPTION: "DigitalHub Agent is a LangGraph-based conversational agent for managing DigitalHub resources, served over HTTP and usable with any OpenAI-compatible model"

jobs:
  determine-platforms:
    runs-on: ubuntu-latest

    outputs:
      platforms: ${{ steps.platforms.outputs.platforms }}
      tag: ${{ steps.platforms.outputs.tag }}
      matrix: ${{ steps.platforms.outputs.matrix }}

    steps:
      - name: Determine build platforms
        id: platforms
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_AMD64="${{ inputs.build_amd64 }}"
            BUILD_ARM="${{ inputs.build_arm }}"

          elif [ "${{ github.event.release.prerelease }}" = "true" ]; then
            # Pre-releases are AMD64 only.
            BUILD_AMD64="true"
            BUILD_ARM="false"

          else
            # Final releases are multi-platform.
            BUILD_AMD64="true"
            BUILD_ARM="true"
          fi

          PLATFORMS=""
          MATRIX="["

          if [ "$BUILD_AMD64" = "true" ]; then
            PLATFORMS="linux/amd64"
            MATRIX="${MATRIX}"'{"platform":"linux/amd64","runner":"ubuntu-24.04","arch":"amd64"}'
          fi

          if [ "$BUILD_ARM" = "true" ]; then
            PLATFORMS="${PLATFORMS:+$PLATFORMS,}linux/arm64"

            if [ "$MATRIX" != "[" ]; then
              MATRIX="$MATRIX,"
            fi

            MATRIX="$MATRIX"'{"platform":"linux/arm64","runner":"ubuntu-24.04-arm","arch":"arm64"}'
          fi

          # If neither architecture is selected, build amd64.
          if [ -z "$PLATFORMS" ]; then
            PLATFORMS="linux/amd64"
            MATRIX="${MATRIX}"'{"platform":"linux/amd64","runner":"ubuntu-24.04","arch":"amd64"}'
          fi

          MATRIX="$MATRIX]"

          TAG="${{ github.event.release.tag_name || github.ref_name }}"

          echo "platforms=$PLATFORMS" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          echo "Platforms: $PLATFORMS"
          echo "Tag: $TAG"
          echo "Matrix: $MATRIX"

  metadata:
    needs: determine-platforms

    runs-on: ubuntu-latest

    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}

    steps:
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

          tags: |
            # Version:
            #   0.1.0       -> 0.1.0
            #   0.1.0-beta1 -> 0.1.0-beta1
            type=semver,pattern={{version}}

            # Major/minor aliases for stable releases only:
            #   0.1.0 -> 0.1
            #   0.1.0 -> 0
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

            # latest is stable releases only.
            type=raw,value=latest,enable=${{ github.event_name == 'release' && github.event.release.prerelease == false }}

            # Useful tags for manual workflow runs.
            type=ref,event=branch
            type=ref,event=tag

          labels: |
            org.opencontainers.image.description=${{ env.IMAGE_DESCRIPTION }}

  build:
    needs:
      - determine-platforms
      - metadata

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.determine-platforms.outputs.matrix) }}

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true

          # Temporary architecture-specific image.
          #
          # These images are used as the source images when the
          # final tags/manifests are published.
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.determine-platforms.outputs.tag }}-${{ matrix.arch }}

          labels: ${{ needs.metadata.outputs.labels }}

          # Each architecture has an independent cache.
          cache-from: |
            type=gha,scope=${{ env.IMAGE_NAME }}-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}

          cache-to: |
            type=gha,mode=max,scope=${{ env.IMAGE_NAME }}-${{ matrix.arch }}
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max

  publish-prerelease:
    needs:
      - determine-platforms
      - metadata
      - build

    # Pre-release: AMD64 only, version tag only (latest is NOT updated).
    if: |
      github.event_name == 'release' &&
      github.event.release.prerelease == true

    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish pre-release tag
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.determine-platforms.outputs.tag }}
          METADATA_TAGS: ${{ needs.metadata.outputs.tags }}
        shell: bash
        run: |
          SOURCE="$IMAGE:$TAG-amd64"

          echo "Source image: $SOURCE"
          echo "Publishing:"
          echo "$METADATA_TAGS"

          while IFS= read -r TARGET; do
            [ -z "$TARGET" ] && continue

            docker buildx imagetools create \
              -t "$TARGET" \
              "$SOURCE"
          done <<< "$METADATA_TAGS"

  publish-release:
    needs:
      - determine-platforms
      - metadata
      - build

    # Final release: AMD64 + ARM64 multi-platform manifest published as
    # version, major.minor, major and latest.
    if: |
      github.event_name == 'release' &&
      github.event.release.prerelease == false

    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish multi-platform release tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.determine-platforms.outputs.tag }}
          METADATA_TAGS: ${{ needs.metadata.outputs.tags }}
          IMAGE_DESCRIPTION: ${{ env.IMAGE_DESCRIPTION }}
        shell: bash
        run: |
          AMD64="$IMAGE:$TAG-amd64"
          ARM64="$IMAGE:$TAG-arm64"

          echo "AMD64 image: $AMD64"
          echo "ARM64 image: $ARM64"
          echo "Publishing:"
          echo "$METADATA_TAGS"

          while IFS= read -r TARGET; do
            [ -z "$TARGET" ] && continue

            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.description=${IMAGE_DESCRIPTION}" \
              -t "$TARGET" \
              "$AMD64" \
              "$ARM64"
          done <<< "$METADATA_TAGS"

  publish-manual:
    needs:
      - determine-platforms
      - metadata
      - build

    # Manual builds use the selected architecture(s) and NEVER update latest.
    if: github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manual build
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.determine-platforms.outputs.tag }}
          PLATFORMS: ${{ needs.determine-platforms.outputs.platforms }}
          METADATA_TAGS: ${{ needs.metadata.outputs.tags }}
        shell: bash
        run: |
          case "$PLATFORMS" in
            "linux/amd64")
              SOURCES=("$IMAGE:$TAG-amd64") ;;
            "linux/arm64")
              SOURCES=("$IMAGE:$TAG-arm64") ;;
            "linux/amd64,linux/arm64")
              SOURCES=("$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64") ;;
            *)
              echo "Unsupported platform selection: $PLATFORMS"
              exit 1 ;;
          esac

          while IFS= read -r TARGET; do
            [ -z "$TARGET" ] && continue

            # Never allow manual builds to update latest.
            if [ "$TARGET" = "$IMAGE:latest" ]; then
              continue
            fi

            docker buildx imagetools create \
              -t "$TARGET" \
              "${SOURCES[@]}"
          done <<< "$METADATA_TAGS"
